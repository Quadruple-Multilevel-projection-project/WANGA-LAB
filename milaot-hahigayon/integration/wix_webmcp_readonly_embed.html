<script>
(function(){
 if(window.__wangaWebMCPRegistered)return;window.__wangaWebMCPRegistered=true;
 const base='https://raw.githubusercontent.com/Quadruple-Multilevel-projection-project/WANGA-LAB/milaot-hahigayon-structural-integration-v1/';
 const mc=(typeof document!=="undefined"&&document.modelContext)||(typeof navigator!=="undefined"&&navigator.modelContext);
 if(!mc||typeof mc.registerTool!=="function"){
  window.__wangaWebMCPStatus="unavailable in this browser (document.modelContext not exposed)";
  return;
 }
 const cache={};
 async function data(path){if(!cache[path])cache[path]=fetch(base+path,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status+" for "+path);return r.json()});return cache[path]}
 const tools=[
  {name:"wanga_get_structural_audit_status",title:"Get structural audit status",description:"Returns the latest source-grounded mechanical audit status, coverage, findings, and unresolved-review warnings for Milaot HaHigayon.",inputSchema:{type:"object",properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(){return data("artifacts/current_audit_status.json")}},
  {name:"wanga_search_logic_corpus",title:"Search logic corpus",description:"Searches source-preserving candidate sentences across the fourteen gates. Results include source offsets; sentence boundaries are not verified syntax.",inputSchema:{type:"object",properties:{query:{type:"string"},gate:{type:"integer",minimum:1,maximum:14},limit:{type:"integer",minimum:1,maximum:50}},required:["query"],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const q=String(input.query||"").trim().toLowerCase();if(!q)return {error:"query is required"};const c=await data("artifacts/book_sentence_registry.json");const limit=Math.min(50,Math.max(1,Number(input.limit)||20));const results=[];for(const ch of c.chapters){if(input.gate&&ch.chapter!==input.gate)continue;for(const u of ch.sentence_units){if(u.original_text.toLowerCase().includes(q)||u.word_tokens.some(t=>t.toLowerCase()===q)){results.push({chapter:ch.chapter,sentence_id:u.sentence_id,text:u.original_text,source_start_char:u.source_start_char,source_end_char:u.source_end_char,status:u.segmentation_status});if(results.length>=limit)return {query:q,count:results.length,results}}}}return {query:q,count:results.length,results}}},
  {name:"wanga_get_gate14_sentence_structure",title:"Get Gate XIV sentence structure",description:"Returns derived structural annotations for Gate XIV sentence candidates; unresolved links remain explicit.",inputSchema:{type:"object",properties:{sentence_id:{type:"string"},limit:{type:"integer",minimum:1,maximum:34}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const a=await data("artifacts/gate14_sentence_structure.json");const rows=input.sentence_id?a.units.filter(u=>u.sentence_id===input.sentence_id):a.units.slice(0,Math.min(34,Math.max(1,Number(input.limit)||34)));return {status:a.status,count:rows.length,units:rows}}},
  {name:"wanga_find_exact_word_overlaps",title:"Find exact word overlaps",description:"Returns exact surface-token overlaps between Gate XIV and earlier gates. An overlap is not a verified semantic relation.",inputSchema:{type:"object",properties:{term:{type:"string"}},required:["term"],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const m=await data("artifacts/gate14_word_occurrence_matrix.json");const term=String(input.term||"");return {relation_status:"LEXICAL_OVERLAP_ONLY_NOT_A_SEMANTIC_LINK",matches:m.overlaps.filter(x=>x.surface_term===term)}}},
  {name:"wanga_get_word_role_candidates",title:"Get word role candidates",description:"Returns token-level candidate role labels and source offsets for Gate XIV. Rule-based labels are not verified syntax.",inputSchema:{type:"object",properties:{sentence_id:{type:"string"},term:{type:"string"},limit:{type:"integer",minimum:1,maximum:100}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const w=await data("artifacts/gate14_word_role_candidates.json");let rows=w.tokens;if(input.sentence_id)rows=rows.filter(x=>x.sentence_id===input.sentence_id);if(input.term)rows=rows.filter(x=>x.surface===input.term);const limit=Math.min(100,Math.max(1,Number(input.limit)||25));return {status:w.status,count:rows.length,returned:rows.slice(0,limit)}}},
  {name:"wanga_get_gate14_clause_candidates",title:"Get Gate XIV clause candidates",description:"Returns source-offset clause candidates for Gate XIV. Clause boundaries are punctuation-based and not verified syntax.",inputSchema:{type:"object",properties:{sentence_id:{type:"string"},limit:{type:"integer",minimum:1,maximum:100}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const c=await data("artifacts/gate14_clause_registry.json");let rows=c.clauses;if(input.sentence_id)rows=rows.filter(x=>x.sentence_id===input.sentence_id);const limit=Math.min(100,Math.max(1,Number(input.limit)||30));return {status:c.status,count:rows.length,returned:rows.slice(0,limit)}}},
  {name:"wanga_get_relation_review_queue",title:"Get unresolved relation review queue",description:"Returns unresolved Gate XIV-to-prior-gate pairs prioritized by exact content-term overlap. Queue items are not verified structural links.",inputSchema:{type:"object",properties:{gate14_sentence_id:{type:"string"},prior_gate:{type:"integer",minimum:1,maximum:13},limit:{type:"integer",minimum:1,maximum:100}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){const q=await data("artifacts/gate14_relation_review_queue.json");let rows=q.items;if(input.gate14_sentence_id)rows=rows.filter(x=>x.gate14_sentence_id===input.gate14_sentence_id);if(input.prior_gate)rows=rows.filter(x=>x.prior_gate===input.prior_gate);const limit=Math.min(100,Math.max(1,Number(input.limit)||30));return {status:q.status,count:rows.length,returned:rows.slice(0,limit)}}}
 ];
 ];
 let count=0;for(const tool of tools){try{mc.registerTool(tool);count++}catch(e){console.warn("WANGA WebMCP registration failed",tool.name,e)}}
 window.__wangaWebMCPStatus=count===tools.length?"registered "+count+" read-only tools":"partially registered "+count+"/"+tools.length+" read-only tools";
})();
</script>
