name: WFLVB tests
on:
  push:
    branches: ["feat/wflvb-v0.1"]
  pull_request:
    branches: ["main", "master"]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
