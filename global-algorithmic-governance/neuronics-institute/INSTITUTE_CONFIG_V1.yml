evidence_status_vocabulary:
  findings: ["OBSERVED", "REPORTED", "DERIVED", "HYPOTHESIS", "VERIFIED", "REFUTED", "UNRESOLVED"]
  evidence_levels:
    - "L0_OBSERVATION"
    - "L1_REPRODUCIBLE"
    - "L2_VERIFIED"
    - "L3_CROSS_ENVIRONMENT"
    - "L4_INSTITUTIONAL_READY"
  note: "Evidence levels do not express severity or regulatory approval."
acceptance_gates:
  - "Each organization has an ID, mandate, reporting line, human owner, input/output and permission scope."
  - "Each metric has a definition, units, baseline, method, source, uncertainty and reproduction procedure."
  - "Each active configuration has a version, tests, approval and rollback."
  - "No VERIFIED finding without actual test evidence."
  - "No public release without a quality gate and authorized publication decision."
  - "No institutional recognition or regulatory-authority claim without primary evidence."
open_items:
  - "Confirm canonical WION name and acronym."
  - "Clarify the intended meaning of the phrase יציבות פולקאית."
  - "Approve OR charter, appointment, independence, access, budget and appeal process."
  - "Inventory financial/economic data sources and access rights."
  - "Define context-specific metric thresholds only after baseline and validation."
  - "Keep numeric weights NOT_CREATED until grounded and verified."
  - "Audit logic_engine_v1 before operational assignment."
  - "Verify AppDeploy and GitHub integrations end-to-end before setting CONNECTED."
  - "No WION legal registration, international recognition or regulatory authority is established by this file."
