name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded formal reasoning dependency
        run: python -m pip install --disable-pip-version-check -r requirements-formal.txt

      - name: Logic contribution ledger verifier tests
        run: python -m unittest discover -s tests -p 'test_logic_contribution_ledger_verifier.py' -v

      - name: Logic contribution ledger JSON Schema validation
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_path = Path("schemas/logic-contribution-ledger-event-v1.schema.json")
          example_path = Path("examples/logic-contribution-ledger-event.v1.example.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          example = json.loads(example_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          validator.validate(example)

          negative_quantity = copy.deepcopy(example)
          negative_quantity["quantity"] = -1
          if not list(validator.iter_errors(negative_quantity)):
              raise SystemExit("FAIL: ledger schema accepted a negative quantity")

          invalid_approval = copy.deepcopy(example)
          invalid_approval["event_type"] = "CREDIT_APPROVED"
          invalid_approval["review_status"] = "ACCEPTED"
          invalid_approval["authorization"]["state"] = "PENDING"
          if not list(validator.iter_errors(invalid_approval)):
              raise SystemExit("FAIL: ledger schema accepted a pending authorization for CREDIT_APPROVED")

          print(f"PASS: {schema_path} validates the example and rejects invalid quantity/authorization states")
          print("NOTE: the example event_sha256 is an illustrative placeholder; cryptographic chain checks run in the dedicated verifier tests")
          PY

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Formal reasoning adapter tests
        run: python -m unittest discover -s tests -p 'test_formal_reasoning.py' -v

      - name: Formal reasoning benchmark
        run: python scripts/run_formal_reasoning_benchmarks.py

      - name: Source-grounded benchmark intake tests
        run: python -m unittest discover -s tests -p 'test_source_grounded_logic_benchmark.py' -v

      - name: Audit source-grounded benchmark readiness
        run: python scripts/audit_source_grounded_logic_benchmark.py --out research/reports/formal-reasoning/source-grounded-benchmark-latest.json


      - name: Typed formal-fragment tests
        run: python -m unittest discover -s tests -p 'test_formal_typed_fragment.py' -v

      - name: Typed formal benchmark tests
        run: python -m unittest discover -s tests -p 'test_formal_typed_benchmark.py' -v

      - name: Logic package contract tests
        run: python -m unittest discover -s tests -p 'test_logic_package_contract.py' -v

      - name: Formal package JSON schema tests
        run: python -m unittest discover -s tests -p 'test_formal_package_schemas.py' -v

      - name: Validate ARK-Swarm library matrix
        run: python scripts/validate_ark_swarm_library_matrix.py


      - name: ARK-Swarm + Logic Trader integration tests
        run: python -m unittest discover -s tests -p 'test_ark_swarm_logic_trader.py' -v

      - name: Vitruvius queue regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_vitruvius_forensic_research.py

      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path(".").rglob("*.json"):
              if any(part in {".git", ".venv", "node_modules"} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("JSON validation passed")
          PY

      - name: Repository status summary
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Python sources: $(find . -type f -name '*.py' -not -path './.git/*' | wc -l)"
          echo "JSON documents: $(find . -type f -name '*.json' -not -path './.git/*' | wc -l)"
