name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Vitruvius queue regression tests
        run: python -m unittest discover -s tests -p 'test_vitruvius_forensic_research.py' -v

      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path(".").rglob("*.json"):
              if any(part in {".git", ".venv", "node_modules"} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("JSON validation passed")
          PY

      - name: Repository status summary
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Python sources: $(find . -type f -name '*.py' -not -path './.git/*' | wc -l)"
          echo "JSON documents: $(find . -type f -name '*.json' -not -path './.git/*' | wc -l)"
