# Portable workflow example for a standalone limbo-cartography-core repository.
# When this package is nested in WANGA-LAB, the active workflow is at the parent repository's
# .github/workflows/daily-limbo-cartography-agent.yml.
name: Limbo Cartography Core (Standalone Layout)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest jsonschema
      - run: |
          python engine/deterministic_executor.py
          python engine/drift_validator.py
          python -m pytest -q tests
          python engine/seismic_detector.py
          python engine/axiomatic_stress_tester.py
          python engine/logic_bundle_builder.py
          python engine/drift_validator.py
