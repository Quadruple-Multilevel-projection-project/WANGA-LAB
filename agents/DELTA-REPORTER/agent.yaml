agent_id: DELTA-REPORTER
domain: DELTA_REPORTING
angular_domain: 90deg
responsibility: "Compile pure delta reports from upstream findings without performing research."
inputs_allowed:
  - VIT-SOURCE_findings
  - RAMBAM-SOURCE_findings
  - FORMALIZER_findings
  - CROSS-CORPUS_findings
  - CLAIM-FORENSIC_findings
outputs:
  - new_findings
  - contradictions
  - status_changes
  - negative_findings
  - open_gaps
can:
  - deduplicate_delta
  - compile_new_findings
  - surface_contradictions
  - inherit_status_without_promotion
cannot:
  - research
  - search_sources
  - alter_upstream_status
  - restate_unchanged_verified_facts
key_invariant: "Report only delta; suppress noise."
status_policy: "Inherited statuses only; no independent promotion or downgrade."
