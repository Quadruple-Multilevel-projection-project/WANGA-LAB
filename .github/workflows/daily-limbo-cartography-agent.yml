name: WANGA-LAB Limbo Cartography Core

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "limbo-cartography-core/**"
      - ".github/workflows/daily-limbo-cartography-agent.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: limbo-cartography-core
  cancel-in-progress: false

jobs:
  validate-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Create execution log
        working-directory: limbo-cartography-core
        run: python engine/deterministic_executor.py
      - name: Validate repository baseline
        working-directory: limbo-cartography-core
        run: python engine/drift_validator.py
      - name: Run software tests
        working-directory: limbo-cartography-core
        run: python -m pytest -q tests
      - name: Inspect registered collapse points
        working-directory: limbo-cartography-core
        run: python engine/seismic_detector.py
      - name: Run structural Keystone tests
        working-directory: limbo-cartography-core
        run: python engine/axiomatic_stress_tester.py
      - name: Build unverified logic bundle drafts
        working-directory: limbo-cartography-core
        run: python engine/logic_bundle_builder.py
      - name: Validate resulting state
        working-directory: limbo-cartography-core
        run: python engine/drift_validator.py
      - name: Open or update automation PR (never push directly to the default branch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/limbo-cartography-daily
          delete-branch: false
          title: "Limbo Cartography daily evidence update"
          commit-message: "cartography: preserve validated daily outputs"
          body: "Automated evidence update. Does not claim semantic verification; review CI results and source provenance before merge."
          add-paths: |
            limbo-cartography-core/cartography/reality_matrix.json
            limbo-cartography-core/cartography/logic_bundles/**
            limbo-cartography-core/cartography/run_logs/latest_execution.json
