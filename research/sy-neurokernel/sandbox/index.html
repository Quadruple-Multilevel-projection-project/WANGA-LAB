<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SY-NeuroKernel Sandbox</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#e8edf7}
main{max-width:1200px;margin:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#141b30;border:1px solid #2b3554;border-radius:12px;padding:16px}
.metric{font-size:32px;font-weight:700}
#graph{width:100%;height:620px;background:#0e1528;border-radius:12px}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
small{opacity:.75}
</style>
</head>
<body>
<main>
<h1>SY-NeuroKernel — Local Sandbox</h1>
<p>Formal topology is fixed. The browser layer visualizes the 22-address / 231-gate kernel without external libraries.</p>
<div class="grid">
<div class="card"><small>NODES</small><div class="metric">22</div></div>
<div class="card"><small>UNORDERED GATES</small><div class="metric">231</div></div>
<div class="card"><small>DIRECTED</small><div class="metric">462</div></div>
<div class="card"><small>FULL MATRIX</small><div class="metric">484</div></div>
</div>
<p><button id="rerender">Recompute deterministic layout</button></p>
<svg id="graph" viewBox="0 0 1000 620" role="img" aria-label="Complete graph K22"></svg>
<p><small id="status"></small></p>
</main>
<script>
const N=22, svg=document.querySelector('#graph'), status=document.querySelector('#status');
function draw(){
  svg.innerHTML='';
  const cx=500,cy=310,r=235, pts=[];
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',pts[i][0]);l.setAttribute('y1',pts[i][1]);l.setAttribute('x2',pts[j][0]);l.setAttribute('y2',pts[j][1]);
    l.setAttribute('stroke','#52607e');l.setAttribute('stroke-width','.7');l.setAttribute('opacity','.55');svg.appendChild(l);
  }
  pts.forEach((p,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',8);c.setAttribute('fill','#dce6ff');svg.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',p[0]);t.setAttribute('y',p[1]-13);t.setAttribute('fill','#fff');t.setAttribute('font-size','12');t.setAttribute('text-anchor','middle');t.textContent=i+1;svg.appendChild(t);
  });
  status.textContent='Verified layout: 22 nodes, 231 unordered edges. No external network calls.';
}
draw();document.querySelector('#rerender').onclick=draw;
</script>
</body>
</html>
