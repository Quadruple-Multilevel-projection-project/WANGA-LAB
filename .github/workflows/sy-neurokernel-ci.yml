name: SY-NeuroKernel CI

on:
  pull_request:
    paths:
      - 'research/sy-neurokernel/**'
      - '.github/workflows/sy-neurokernel-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'research/sy-neurokernel/**'
      - '.github/workflows/sy-neurokernel-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/sy-neurokernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run invariant tests
        run: python -m unittest discover -s tests -v
