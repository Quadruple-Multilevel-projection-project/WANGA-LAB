name: Repository Integrity

on:
  push:
    branches: [main]
    paths:
      - 'logic_proof/**'
      - 'formal_reasoning/**'
      - 'requirements-logic.txt'
      - 'requirements-formal.txt'
      - 'schemas/formal-fragment-v1.schema.json'
      - 'schemas/logic-formalization-queue-item-v1.schema.json'
      - 'schemas/logic-package-contract-v1.schema.json'
      - 'schemas/candidate-evaluation-policy-v1.schema.json'
      - 'tests/test_logic_proof_adapter.py'
      - 'tests/test_logic_proof_benchmark.py'
      - 'tests/test_logic_package_contract.py'
      - 'tests/test_logic_json_schemas.py'
      - 'tests/test_logic_formalization_queue.py'
      - 'tests/test_formal_reasoning.py'
      - 'tests/test_ark_swarm_logic_trader.py'
      - 'scripts/run_formal_logic_benchmark.py'
      - 'scripts/run_formal_reasoning_benchmarks.py'
      - 'scripts/validate_ark_swarm_library_matrix.py'
      - 'ark_swarm/**'
      - 'logic_fractal/**'
      - 'research/ecosystem/library_integration_matrix.json'
      - '.github/workflows/repository-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'logic_proof/**'
      - 'formal_reasoning/**'
      - 'requirements-logic.txt'
      - 'requirements-formal.txt'
      - 'schemas/formal-fragment-v1.schema.json'
      - 'schemas/logic-formalization-queue-item-v1.schema.json'
      - 'schemas/logic-package-contract-v1.schema.json'
      - 'schemas/candidate-evaluation-policy-v1.schema.json'
      - 'tests/test_logic_proof_adapter.py'
      - 'tests/test_logic_proof_benchmark.py'
      - 'tests/test_logic_package_contract.py'
      - 'tests/test_logic_json_schemas.py'
      - 'tests/test_logic_formalization_queue.py'
      - 'tests/test_formal_reasoning.py'
      - 'tests/test_ark_swarm_logic_trader.py'
      - 'scripts/run_formal_logic_benchmark.py'
      - 'scripts/run_formal_reasoning_benchmarks.py'
      - 'scripts/validate_ark_swarm_library_matrix.py'
      - 'ark_swarm/**'
      - 'logic_fractal/**'
      - 'research/ecosystem/library_integration_matrix.json'
      - '.github/workflows/repository-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded formal reasoning dependency
        run: python -m pip install --disable-pip-version-check -r requirements-logic.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Formal reasoning adapter tests
        run: python -m unittest discover -s tests -p 'test_formal_reasoning.py' -v

      - name: Formal reasoning benchmark
        run: python scripts/run_formal_reasoning_benchmarks.py

      - name: Validate ARK-Swarm library integration matrix
        run: python scripts/validate_ark_swarm_library_matrix.py

      - name: Typed logic proof adapter tests
        run: python -m unittest discover -s tests -p 'test_logic_proof_adapter.py' -v

      - name: Typed logic proof benchmark tests
        run: python -m unittest discover -s tests -p 'test_logic_proof_benchmark.py' -v

      - name: Typed logic package contract tests
        run: python -m unittest discover -s tests -p 'test_logic_package_contract.py' -v

      - name: Formalization queue tests
        run: python -m unittest discover -s tests -p 'test_logic_formalization_queue.py' -v

      - name: Logic JSON schema tests
        run: python -m unittest discover -s tests -p 'test_logic_json_schemas.py' -v

      - name: Typed formal logic benchmark
        run: python scripts/run_formal_logic_benchmark.py --out "$RUNNER_TEMP/formal-logic-benchmark.json"


      - name: ARK-Swarm + Logic Trader integration tests
        run: python -m unittest discover -s tests -p 'test_ark_swarm_logic_trader.py' -v

      - name: Vitruvius queue regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_vitruvius_forensic_research.py

      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path(".").rglob("*.json"):
              if any(part in {".git", ".venv", "node_modules"} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("JSON validation passed")
          PY

      - name: Repository status summary
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Python sources: $(find . -type f -name '*.py' -not -path './.git/*' | wc -l)"
          echo "JSON documents: $(find . -type f -name '*.json' -not -path './.git/*' | wc -l)"
