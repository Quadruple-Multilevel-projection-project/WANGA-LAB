name: Algorithmic Genealogy and Linguistic Evidence CI

on:
  pull_request:
    paths:
      - "wanga_runtime/**"
      - "schemas/**"
      - "tests/test_algorithmic_genealogy.py"
      - "tests/test_linguistic_evidence_mesh.py"
      - ".github/workflows/algorithmic-genealogy-ci.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "wanga_runtime/**"
      - "schemas/**"
      - "tests/test_algorithmic_genealogy.py"
      - "tests/test_linguistic_evidence_mesh.py"
      - ".github/workflows/algorithmic-genealogy-ci.yml"

permissions:
  contents: read

jobs:
  genealogy-and-lexical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
      - name: Syntax check
        run: python -m compileall -q wanga_runtime tests/test_algorithmic_genealogy.py tests/test_linguistic_evidence_mesh.py
      - name: Deterministic genealogy and lexical evidence tests
        run: PYTHONPATH=. python -m pytest -q tests/test_algorithmic_genealogy.py tests/test_linguistic_evidence_mesh.py
