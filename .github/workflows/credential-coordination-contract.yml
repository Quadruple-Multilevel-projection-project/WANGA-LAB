name: Credential Coordination Contract

on:
  pull_request:
    paths:
      - 'config/security/**'
      - 'config/umbrella/**'
      - 'schemas/credential-coordination-v1.schema.json'
      - 'tests/test_credential_coordination_config.py'
      - '.github/workflows/credential-coordination-contract.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  credential-coordination-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate credential coordination configuration
        run: python -m unittest discover -s tests -p 'test_credential_coordination_config.py' -v
