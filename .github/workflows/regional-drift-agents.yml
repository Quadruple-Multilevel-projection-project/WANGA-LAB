name: Regional Drift Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: regional-drift-agents
  cancel-in-progress: false

jobs:
  reg-us:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-US
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_US }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_US }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-US
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-EU
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_EU }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_EU }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-EU
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-il-me:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-IL-ME
      DRIFT_LANGUAGE: he
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_IL_ME }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_IL_ME }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-IL-ME
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-sa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-SA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_SA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_SA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-SA
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-ea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-EA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_EA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_EA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-EA
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-latam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-LATAM
      DRIFT_LANGUAGE: es
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_LATAM }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_LATAM }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-LATAM
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-oceania:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-OCEANIA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_OCEANIA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_OCEANIA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-OCEANIA
          path: ${{ steps.collect.outputs.artifact_path }}

  reg-africa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRIFT_NODE: REG-AFRICA
      DRIFT_LANGUAGE: en
      DRIFT_ENDPOINT: ${{ secrets.DRIFT_ENDPOINT_AFRICA }}
      DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN_AFRICA }}
      DRIFT_MODEL: ${{ vars.DRIFT_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect observations
        id: collect
        run: python ai-drift-forensics/global-drift-network/agents/regional_collector.py
      - uses: actions/upload-artifact@v4
        with:
          name: regional-REG-AFRICA
          path: ${{ steps.collect.outputs.artifact_path }}

  publish-observations:
    needs: [reg-us, reg-eu, reg-il-me, reg-sa, reg-ea, reg-latam, reg-oceania, reg-africa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: regional-*
          path: /tmp/regional
      - name: Collect only this run's observation files
        shell: bash
        run: |
          set -euo pipefail
          destination="ai-drift-forensics/global-drift-network/data/regional-observations"
          mkdir -p "$destination"
          mapfile -d '' files < <(find /tmp/regional -type f -name '*.json' -print0 | sort -z)
          if [ "${#files[@]}" -ne 8 ]; then
            echo "Expected exactly 8 regional observation files; found ${#files[@]}." >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            case "$name" in
              *-REG-*.json) cp -- "$file" "$destination/$name" ;;
              *) echo "Unexpected regional artifact filename: $name" >&2; exit 1 ;;
            esac
          done
          printf 'Collected %s new regional files; historical files were not re-uploaded.\n' "${#files[@]}"
      - name: Open review pull request (no direct main push)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/regional-drift-observations
          delete-branch: false
          title: "data: regional drift observation batch"
          commit-message: "data: regional drift observation batch"
          body: |
            Adds only the eight new regional observation files generated by this workflow run.
            Historical observation files are preserved and are not copied into each artifact.
            This workflow opens or updates a review pull request; it never pushes directly to main.
          add-paths: |
            ai-drift-forensics/global-drift-network/data/regional-observations/*.json
