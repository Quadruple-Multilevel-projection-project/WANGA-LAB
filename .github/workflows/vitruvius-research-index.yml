name: Vitruvius Research Index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Vitruvius index
        run: python scripts/vitruvius_automation_engine.py --write
      - name: Run Vitruvius tests
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=. python -m pytest -q tests/test_vitruvius_automation_engine.py tests/test_vitruvius_forensic_research.py
      - name: Build forensic research queue
        run: python scripts/vitruvius_forensic_research.py --write
      - name: Upload generated index
        uses: actions/upload-artifact@v4
        with:
          name: vitruvius-research-index
          path: |
            vitruvius/VITRUVIUS_INDEX.json
            vitruvius/VITRUVIUS_WORK_QUEUE.json
            vitruvius/VITRUVIUS_FORENSIC_WORK_QUEUE.json
