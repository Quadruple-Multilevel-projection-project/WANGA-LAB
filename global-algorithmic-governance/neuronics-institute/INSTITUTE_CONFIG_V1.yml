schema_version: "wion.config.v1"
config_id: "WION-CONFIG-0.1.0"
version: "0.1.0"
created_at: "2026-11-19"
status: "PROPOSED_ARCHITECTURE"
canonical_name:
  he: "המכון העולמי לנוירוניקה"
  en: "World Institute of Neuronics"
  acronym: "WION"
  naming_status: "PROPOSED"
definition:
  status: "PROJECT_WORKING_DEFINITION"
  text: "מחקר והנדסה של רשתות עמוקות מרובות שכבות: צמתים, קשרים, זרימות, מצבים, הסתגלות, תלות, קונפיגורציה, התפשטות ושינוי."
  scope:
    - "computational_networks"
    - "algorithmic_networks"
    - "organizational_networks"
    - "economic_networks"
    - "financial_networks"
    - "AI_and_neural_systems"
  note: "הגדרה תפעולית של הפרויקט בלבד; אינה מוצגת כתחום מדעי מוסכם או תקן."
institutional_placement:
  umbrella: "Umbrella Organization"
  parent_institute: "Global Algorithmic Governance Institute"
  child_institute: "WION"
  status: "PROPOSED"
  separation:
    WANGA_LAB: "תשתית מחקרית וחישובית נפרדת; אינה זהות מוסדית של WION."
    AI_Drift_Forensics: "יכולת פורנזיקה ואימות טכני נפרדת; נשמרת במיקומה."
    Global_Drift_Network: "רשת תצפית/ניתוח ייעודית; נשמרת במיקומה ומקושרת בממשקים."
governance:
  council:
    id: "WION-COUNCIL"
    role: "אחריות מוסדית, אישור מנדטים, תקצוב ובחירת ועדות"
    status: "PROPOSED"
  operating_model:
    directorates: 3
    independent_commission: "OR"
    geographic_branches: "FUTURE_ONLY_AFTER_LOCAL_CHARTER_AND_TEAM"
  independence_rules:
    - "OR reports directly to the WION Council."
    - "OR is functionally independent from all three directorates."
    - "Algorithmics provides internal configuration controls and technical audit, not independent external oversight."
    - "No directorate may audit and approve its own disputed finding as independent review."
    - "No legal or regulatory authority is created by this configuration."
bodies:
  - id: "WION-ANA"
    name_he: "מנהלת האנליטיקה לרשתות עמוקות"
    name_en: "Deep Network Analytics Directorate"
    mandate: "תצפית, מדידה, ניתוח, קווי בסיס, טופולוגיה, דינמיקה, התפשטות וניתוח כלכלי/פיננסי."
    outputs:
      - "observations"
      - "baseline_records"
      - "drift_metrics"
      - "network_graphs"
      - "analytical_reports"
      - "evidence_cases"
    organizations:
      - id: "WION-ANA-01"
        name_he: "המכון למדידה, תצפית וקווי בסיס"
        focus: "observation, measurement, baseline, data quality"
      - id: "WION-ANA-02"
        name_he: "המרכז לדינמיקה, טופולוגיה והתפשטות רשתות"
        focus: "network topology, dynamics, propagation, temporal and geographic analysis"
      - id: "WION-ANA-03"
        name_he: "המכון לאנליטיקה כלכלית ופיננסית"
        focus: "credit, debt, payments, liquidity, exposure and financial network analytics"
      - id: "WION-ANA-04"
        name_he: "המרכז לחקר התנהגות מערכות AI ורשתות נוירוניות"
        focus: "model, configuration, interaction and behavioral drift research"
      - id: "WION-ANA-05"
        name_he: "מעבדת ראיות ופורנזיקה אנליטית"
        focus: "evidence records, reproducibility, alternative explanations and limits"
  - id: "WION-LOG"
    name_he: "מנהלת הלוגיסטיקה לרשתות עמוקות"
    name_en: "Deep Network Logistics Directorate"
    mandate: "ניהול תשתיות, זרימת נתונים, מחשוב, תורים, סוכנים, צמתים, משימות ורציפות תפעולית."
    outputs:
      - "infrastructure_maps"
      - "task_and_queue_records"
      - "worker_execution_logs"
      - "data_intake_records"
      - "continuity_and_incident_reports"
    organizations:
      - id: "WION-LOG-01"
        name_he: "מרכז תשתיות מבוזרות, מחשוב וצמתים"
        focus: "compute, storage, networking, node operations and recovery"
      - id: "WION-LOG-02"
        name_he: "מרכז קליטת נתונים ותפעול ראיות"
        focus: "data intake, timestamps, integrity, normalization and cataloguing"
      - id: "WION-LOG-03"
        name_he: "מרכז תזמור סוכנים וניהול משימות"
        focus: "queues, capability routing, budgets, retries, deduplication and result collection"
      - id: "WION-LOG-04"
        name_he: "מרכז צמתים אזוריים ושיתוף פעולה בינלאומי"
        focus: "regional nodes and institutional research interfaces"
      - id: "WION-LOG-05"
        name_he: "מרכז רציפות, חוסן וניהול אירועים"
        focus: "availability, incident response, backup and continuity"
  - id: "WION-ALG"
    name_he: "מנהלת האלגוריתמיקה לרשתות עמוקות"
    name_en: "Deep Network Algorithms and Configuration Directorate"
    mandate: "קונפיגורציה דינמית, מניעת דריפט, חוזי מערכת, אינווריאנטים, בקרות, ביקורת טכנית פנימית וניהול שינויים."
    control_role: "SECOND_LINE_CONFIGURATION_AND_INTERNAL_TECHNICAL_AUDIT"
    outputs:
      - "versioned_configuration_contracts"
      - "invariants_and_guardrails"
      - "test_suites"
      - "change_control_records"
      - "drift_prevention_findings"
      - "rollback_recommendations"
    organizations:
      - id: "WION-ALG-01"
        name_he: "המכון ללוגיקה דינמית וקונפיגורציה"
        focus: "source-grounded configuration rules and versioned logic"
      - id: "WION-ALG-02"
        name_he: "המעבדה למניעת דריפט ויציבות מערכתית"
        focus: "baselines, drift detection, regression tests and correction conditions"
      - id: "WION-ALG-03"
        name_he: "המרכז לביקורת אלגוריתמית, אימות ושחזור"
        focus: "structural and semantic tests, deterministic replay and counterexamples"
      - id: "WION-ALG-04"
        name_he: "המכון לתקנים, סכמות ואינטרופרביליות"
        focus: "schemas, metric definitions, API contracts and standards crosswalks"
      - id: "WION-ALG-05"
        name_he: "משרד בקרת שינויים וחוזי מערכת"
        focus: "configuration approval, version history, impact analysis, permissions and rollback"
independent_commission:
  id: "OR"
  name_he: "ועדת או״ר — הוועדה לפיקוח עולמי על דריפטים ומדדי דריפט"
  name_en: "Global Drift Oversight and Metrics Commission"
  reports_to: "WION-COUNCIL"
  independence: "FUNCTIONALLY_INDEPENDENT"
  mandate:
    - "independent oversight of drift metrics and measurement methodology"
    - "review of baselines, thresholds, uncertainty, data quality and reproducibility"
    - "oversight of algorithmic configuration and internal audit controls"
    - "independent sampling, replication and challenge of findings"
    - "review of economic, financial, monetary and fiscal stability drift indicators"
  committees:
    - id: "OR-ECO"
      name: "Economic Drift Committee"
    - id: "OR-FIN"
      name: "Financial and Monetary Stability Committee"
    - id: "OR-FISC"
      name: "Fiscal and Sovereign Stability Committee"
    - id: "OR-MET"
      name: "Drift Metrics and Methodology Committee"
    - id: "OR-IND"
      name: "Independent Audit and Reproduction Committee"
    - id: "OR-AI"
      name: "AI and Deep-Network Drift Oversight Committee"
  powers_proposed:
    - "request evidence and reproducibility packages"
    - "commission independent remeasurement"
    - "issue findings, limitations and recommendations to the Council"
    - "request a response and corrective-action plan from a directorate"
    - "recommend holding publication of an unverified finding"
  prohibited:
    - "operating systems under review"
    - "altering raw observations"
    - "overriding lawful human or institutional decision makers"
    - "claiming statutory regulatory, sovereign, monetary or judicial authority"
    - "self-certifying a directorate's disputed result"
three_lines_of_control:
  first_line:
    bodies: ["WION-ANA", "WION-LOG"]
    role: "operations, observation, measurement, execution logs and first-level issue reporting"
  second_line:
    bodies: ["WION-ALG"]
    role: "configuration, invariants, tests, guardrails, change control and internal technical audit"
  third_line:
    body: "OR"
    role: "independent oversight of metrics, controls, findings, evidence and audit quality"
drift_measurement:
  model: "MULTIDIMENSIONAL_VECTOR"
  universal_score: "NOT_DEFINED"
  numeric_weights: "NOT_CREATED"
  global_thresholds: "UNRESOLVED"
  required_metric_fields:
    - "metric_id"
    - "domain"
    - "unit"
    - "baseline_id"
    - "baseline_value"
    - "observed_value"
    - "delta"
    - "observation_window"
    - "persistence"
    - "coverage"
    - "data_quality"
    - "uncertainty"
    - "method_version"
    - "alternative_causes"
    - "reproducibility_status"
    - "evidence_refs"
  metric_families:
    - "structural"
    - "operational"
    - "behavioral_algorithmic"
    - "economic"
    - "financial_monetary"
    - "fiscal_sovereign"
    - "geographic_cross_network"
  financial_reference_domains:
    - "capital_adequacy"
    - "asset_quality"
    - "profitability"
    - "liquidity"
    - "leverage"
    - "credit_conditions"
    - "funding"
    - "market_conditions"
    - "interconnectedness"
    - "cross_border_exposures"
  reference_sources:
    - "IMF Financial Soundness Indicators"
    - "IMF macroprudential policy and financial-system soundness materials"
  aggregation_rule: "No sum or composite score until normalization, pre-registered method, validation and context boundaries are documented."
  unresolved_terms:
    - original: "יציבות פולקאית"
      status: "UNRESOLVED_TERM"
      note: "Preserve original phrase; do not silently replace with political, fiscal or systemic."
configuration_contract:
  required_for_each_component:
    - "component_id_and_human_owner"
    - "mandate_and_authority_boundary"
    - "source_of_truth_and_data_permissions"
    - "input_output_schema_and_units"
    - "baseline_and_configuration_version"
    - "invariants"
    - "unit_integration_regression_and_replay_tests"
    - "change_approval_and_rollback"
    - "audit_log_and_provenance"
    - "failure_states_and_escalation"
  change_lifecycle:
    - "PROPOSED"
    - "IMPACT_ASSESSED"
    - "TESTED"
    - "APPROVED"
    - "DEPLOYED"
    - "MONITORED"
    - "REVERSED_OR_REVISED"
  failure_states: ["BLOCKED", "UNRESOLVED", "RETRY_PENDING"]
  no_drift_claim: "Do not claim zero drift; detect, measure, bound, correct when authorized, and re-test."
existing_assets_crosswalk:
  preservation_policy: "LINK_AND_PRESERVE; no silent relocation, rename, merge or replacement of existing sources."
  assets:
